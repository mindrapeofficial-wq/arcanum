name: ARCANUM Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Static smoke tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e
        env:
          ARCANUM_E2E_USERNAME: ${{ secrets.ARCANUM_E2E_USERNAME }}
          ARCANUM_E2E_PASSWORD: ${{ secrets.ARCANUM_E2E_PASSWORD }}
          ARCANUM_E2E_BASE_URL: https://arcanum-las-cinco-escuelas.onrender.com

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
