name: Build ARCANUM Android Beta

on:
  push:
    branches:
      - android-beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare ARCANUM artwork
        run: |
          rm -rf .android-assets
          mkdir -p .android-assets
          cp logo.png .android-assets/logo.png

      - name: Generate Android launcher icons and splash assets
        run: >
          npx @capacitor/assets generate --android
          --assetPath .android-assets
          --iconBackgroundColor '#020202'
          --iconBackgroundColorDark '#020202'
          --splashBackgroundColor '#020202'
          --splashBackgroundColorDark '#020202'
          --logoSplashScale 0.24

      - name: Add Android 13 themed icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v33
          cat > android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
              <monochrome android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Enable native immersive fullscreen
        run: |
          cat > android/app/src/main/java/com/arcanum/MainActivity.java <<'JAVA'
          package com.arcanum;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableImmersiveMode();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  enableImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enableImmersiveMode();
                  }
              }

              private void enableImmersiveMode() {
                  final Window window = getWindow();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = window.getInsetsController();
                      if (controller != null) {
                          controller.hide(
                              WindowInsets.Type.statusBars()
                                  | WindowInsets.Type.navigationBars()
                          );
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/styles.xml")
          s = p.read_text()

          additions = [
              '        <item name="android:windowFullscreen">true</item>',
              '        <item name="android:windowLightStatusBar">false</item>',
              '        <item name="android:windowLightNavigationBar">false</item>',
              '        <item name="android:navigationBarColor">@android:color/transparent</item>',
              '        <item name="android:statusBarColor">@android:color/transparent</item>',
              '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>',
          ]

          target = '<style name="AppTheme.NoActionBar"'
          i = s.find(target)
          if i != -1:
              close = s.find('</style>', i)
              block = s[i:close]
              missing = [line for line in additions if line not in block]
              if missing:
                  s = s[:close] + "\n" + "\n".join(missing) + "\n    " + s[close:]

          p.write_text(s)
          PY

      - name: Verify immersive fullscreen patch
        run: |
          test -f android/app/src/main/java/com/arcanum/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android/app/src/main/java/com/arcanum/MainActivity.java
          grep -q 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' android/app/src/main/java/com/arcanum/MainActivity.java
          grep -q 'android:windowFullscreen' android/app/src/main/res/values/styles.xml

      - name: Verify launcher resources
        run: |
          for density in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher_background.png"
          done
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          test -f android/app/src/main/res/drawable/splash.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -q '<monochrome android:drawable="@mipmap/ic_launcher_foreground"' android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-android-beta-immersive
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
