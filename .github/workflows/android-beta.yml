name: Build ARCANUM Android Beta

on:
  push:
    branches:
      - android-beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare ARCANUM artwork
        run: |
          rm -rf .android-assets
          mkdir -p .android-assets
          cp logo.png .android-assets/logo.png

      - name: Generate Android launcher icons and splash assets
        run: >
          npx @capacitor/assets generate --android
          --assetPath .android-assets
          --iconBackgroundColor '#020202'
          --iconBackgroundColorDark '#020202'
          --splashBackgroundColor '#020202'
          --splashBackgroundColorDark '#020202'
          --logoSplashScale 0.24

      - name: Add Android 13 themed icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v33
          cat > android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
              <monochrome android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify launcher resources
        run: |
          for density in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
            test -f "android/app/src/main/res/mipmap-$density/ic_launcher_background.png"
          done
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          test -f android/app/src/main/res/drawable/splash.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -q '<monochrome android:drawable="@mipmap/ic_launcher_foreground"' android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-android-beta-icons-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
