<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#020202" />
  <meta name="description" content="ARCANUM: Las Cinco Escuelas · Beta privada" />
  <title>ARCANUM · Las Cinco Escuelas</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="assets/css/arcanum.css?v=0.2.1" />
</head>
<body>
  <div id="ambient" aria-hidden="true">
    <div class="orbital orbital-a"></div>
    <div class="orbital orbital-b"></div>
    <div class="ambient-glow"></div>
  </div>

  <div id="boot" class="boot-screen">
    <img src="logo.png" alt="" />
    <p>ABRIENDO EL GRIMORIO</p>
  </div>

  <main id="auth-view" class="gate-shell hidden">
    <section class="gate-card" aria-label="Acceso a ARCANUM">
      <div class="logo-wrap">
        <img src="logo.png" alt="ARCANUM" class="arcanum-logo" />
      </div>
      <div class="mode-tabs" role="tablist" aria-label="Modo de acceso">
        <button class="tab active" id="login-tab" type="button" role="tab" aria-selected="true">ENTRAR</button>
        <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false">REGISTRO</button>
      </div>

      <form class="auth-form" id="auth-form" novalidate>
        <label id="username-field">
          <span>Nombre de usuario</span>
          <input id="username" autocomplete="username" minlength="3" maxlength="24" placeholder="Tu nombre de usuario" required />
        </label>
        <label>
          <span>Contraseña</span>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••" minlength="4" required />
        </label>
        <label class="hidden" id="confirm-field">
          <span>Repite la contraseña</span>
          <input id="confirm-password" type="password" autocomplete="new-password" placeholder="••••" minlength="4" />
        </label>
        <div id="auth-notice" class="notice hidden" role="status" aria-live="polite"></div>
        <button class="primary-action" id="submit-button" type="submit"><span>✦</span><b id="submit-label">ENTRAR</b></button>
      </form>
    </section>
  </main>

  <main id="create-view" class="create-shell hidden">
    <section class="creation-panel">
      <button class="ghost-button creation-logout" id="creation-logout">Cerrar sesión</button>
      <img src="logo.png" class="creation-logo" alt="ARCANUM" />
      <p class="eyebrow">FUNDACIÓN DEL REINO</p>
      <h1>Forja tu Archimago</h1>
      <p class="intro">Tu nombre de usuario será también el nombre de tu reino: <strong id="realm-name-preview"></strong>. Elige tu Escuela; esta decisión definirá tu afinidad mágica durante la beta.</p>
      <form id="create-form" class="creation-form">
        <div>
          <span class="field-caption">Elige una Escuela</span>
          <div id="school-grid" class="school-grid"></div>
        </div>
        <div id="create-notice" class="notice hidden"></div>
        <button class="primary-action" id="create-button" type="submit"><span>✦</span><b>FUNDAR REINO</b></button>
      </form>
    </section>
  </main>

  <main id="game-view" class="game-shell hidden">
    <header class="topbar">
      <div class="brand-mini">
        <img src="logo.png" alt="" />
        <div><strong>ARCANUM</strong><small>LAS CINCO ESCUELAS</small></div>
      </div>
      <div class="resource-strip" id="resource-strip"></div>
      <div class="top-actions">
        <button class="icon-button" id="manual-top-button" title="Manual básico" aria-label="Abrir manual básico">?</button>
        <button class="icon-button" id="refresh-button" title="Actualizar">↻</button>
        <button class="ghost-button" id="logout-button">Salir</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="mage-card">
        <div class="mage-sigil" id="mage-sigil">✦</div>
        <div><strong id="mage-title">Archimago</strong><small id="mage-school">Escuela</small></div>
      </div>
      <nav id="main-nav" class="main-nav" aria-label="Secciones del reino">
        <button data-view="realm" class="active"><span>⌂</span> Reino</button>
        <button data-view="economy"><span>◈</span> Economía</button>
        <button data-view="build"><span>△</span> Construcción</button>
        <button data-view="research"><span>✧</span> Investigación</button>
        <button data-view="army"><span>⚔</span> Ejército</button>
        <button data-view="war"><span>♜</span> Guerra</button>
        <button data-view="ranking"><span>♛</span> Clasificación</button>
        <button data-view="battles"><span>☷</span> Informes</button>
        <button data-view="community"><span>✉</span> Comunidad</button>
      </nav>
      <button class="manual-button" id="manual-side-button" type="button">? &nbsp; MANUAL BÁSICO</button>
      <div class="season-badge" id="season-badge"></div>
    </aside>

    <section class="game-main">
      <div id="view-host" class="view-host"></div>
    </section>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegación móvil">
      <button data-view="realm" class="active"><span>⌂</span><small>Reino</small></button>
      <button data-view="economy"><span>◈</span><small>Economía</small></button>
      <button data-view="build"><span>△</span><small>Construir</small></button>
      <button data-view="research"><span>✧</span><small>Magia</small></button>
      <button data-view="army"><span>⚔</span><small>Ejército</small></button>
      <button data-view="war"><span>♜</span><small>Guerra</small></button>
      <button data-view="ranking"><span>♛</span><small>Ranking</small></button>
      <button data-view="community"><span>✉</span><small>Comunidad</small></button>
    </nav>
  </main>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><div id="modal-content"></div><button id="modal-close" class="ghost-button">Cerrar</button></div>
  </div>

  <script defer src="assets/js/state.js?v=0.2.1"></script>
  <script defer src="assets/js/auth.js?v=0.2.1"></script>
  <script defer src="assets/js/realm-state.js?v=0.2.1"></script>
  <script defer src="assets/js/router.js?v=0.2.1"></script>
  <script defer src="assets/js/community.js?v=0.2.1"></script>
  <script defer src="assets/js/realm.js?v=0.2.1"></script>
  <script defer src="assets/js/economy.js?v=0.2.1"></script>
  <script defer src="assets/js/construction.js?v=0.2.1"></script>
  <script defer src="assets/js/magic.js?v=0.2.1"></script>
  <script defer src="assets/js/army.js?v=0.2.1"></script>
  <script defer src="assets/js/war.js?v=0.2.1"></script>
  <script defer src="assets/js/ui.js?v=0.2.1"></script>
</body>
</html>
