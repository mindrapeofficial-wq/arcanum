<body>
  <div id="ambient" aria-hidden="true">
    <div class="orbital orbital-a"></div>
    <div class="orbital orbital-b"></div>
    <div class="ambient-glow"></div>
  </div>

  <div id="boot" class="boot-screen">
    <img src="logo.png" alt="" />
    <p>ABRIENDO EL GRIMORIO</p>
  </div>

  <main id="auth-view" class="gate-shell hidden">
    <section class="gate-card" aria-label="Acceso a ARCANUM">
      <div class="logo-wrap">
        <img src="logo.png" alt="ARCANUM" class="arcanum-logo" />
      </div>
      <div class="mode-tabs" role="tablist" aria-label="Modo de acceso">
        <button class="tab active" id="login-tab" type="button" role="tab" aria-selected="true">ENTRAR</button>
        <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false">REGISTRO</button>
      </div>

      <form class="auth-form" id="auth-form" novalidate>
        <label id="username-field">
          <span>Nombre de usuario</span>
          <input id="username" autocomplete="username" minlength="3" maxlength="24" placeholder="Tu nombre de usuario" required />
        </label>
        <label>
          <span>Contraseña</span>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••" minlength="4" required />
        </label>
        <label class="hidden" id="confirm-field">

async function doEconomy(action,btn){ const turns=Math.max(1,Math.min(50,Number($("#econ-turns").value)||1)); await actionCall(btn,()=>rpc("run_economy",{p_action:action,p_turns:turns}),`Se han procesado ${turns} turno${turns===1?"":"s"}.`); }
async function doExplore(btn){ const turns=Math.max(1,Math.min(50,Number($("#explore-turns").value)||1)); await actionCall(btn,()=>rpc("explore",{p_turns:turns}),null,(res)=>`Exploración completada: +${n(res.land_gained)} acres.`); }

function renderBuild(){
  const b=realmState.buildings,r=realmState.realm;
  const rows=Object.entries(buildMeta).map(([key,[name,desc,cost]])=>`<div class="building-row"><div><strong>${esc(name)}</strong><small>${esc(desc)}</small></div><div><small>ACTUAL</small><strong>${n(b[key])}</strong></div><div><small>COSTE ${esc(cost)}</small><input data-building="${key}" type="number" min="0" max="9999" value="0" inputmode="numeric"></div></div>`).join("");
  $("#view-host").innerHTML=`${viewHeader("ARQUITECTURA","Construcción",`Transforma tus ${n(r.wilderness)} acres salvajes en infraestructura.`)}<div class="panel"><div class="building-list">${rows}</div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button id="build-button" class="primary-action">✦ CONSTRUIR LOTE</button></div></div>`;
  $("#build-button").addEventListener("click",()=>doBuild($("#build-button")));
}
async function doBuild(btn){
  const plan={}; $$('[data-building]').forEach(i=>{const q=Math.max(0,Math.floor(Number(i.value)||0)); if(q)plan[i.dataset.building]=q;});
  if(!Object.keys(plan).length){toast("Indica al menos un edificio.","error");return;}
  if(plan.barriers && Object.keys(plan).some(k=>k!=="barriers")){toast("Las Barreras deben construirse en una orden separada.","error");return;}
  await actionCall(btn,()=>rpc("build",{p_plan:plan}),null,res=>`Construcción completada. ${n(res.turns_spent)} turnos consumidos.`);
}

function spellEligible(spell){
  if(!spell.researchable || spell.rank==="ancient")return false; const mine=realmState.realm.school_code; if(spell.school_code===mine)return true;
  const school=catalogs.schools.find(s=>s.code===mine); const adjacent=(school?.adjacent_codes||[]).includes(spell.school_code);
  if(mine==="phantasm")return ["simple","average","complex"].includes(spell.rank);
  if(adjacent)return ["simple","average","complex"].includes(spell.rank);
  return ["simple","average"].includes(spell.rank);
}
function renderResearch(){
  const known=new Set(realmState.known_spells.map(s=>s.spell_id)); const st=realmState.research||{}; const guilds=Number(realmState.buildings.guilds||0); const ppt=Math.floor(Math.sqrt(guilds)*3.5);
  const eligible=catalogs.spells.filter(s=>spellEligible(s)&&!known.has(s.id));
  let current=null; if(st.current_spell_id)current=catalogs.spells.find(s=>s.id===st.current_spell_id);
  const cards=catalogs.spells.filter(s=>s.researchable).map(s=>`<div class="spell-card ${known.has(s.id)?"known":""}"><span class="school-dot ${esc(s.school_code)}"></span><strong>${esc(s.name_es)}</strong><small>${esc(rankNames[s.rank]||s.rank)} · ${esc(catalogs.schools.find(x=>x.code===s.school_code)?.name_es||s.school_code)}</small><div class="spell-meta"><span>${known.has(s.id)?"APRENDIDO":spellEligible(s)?`${n(s.research_cost)} RP`:"NO AFIN"}</span><span>+${n(s.spell_level_gain)} NM</span></div></div>`).join("");
  const prog=current&&st.effective_cost?Math.max(0,Math.min(100,100-(Number(st.remaining_points||0)/Number(st.effective_cost))*100)):0;
  $("#view-host").innerHTML=`${viewHeader("GRIMORIO","Investigación",`${n(guilds)} Gremios generan ${n(ppt)} puntos de investigación por turno.`)}
  <div class="grid-2" style="margin-bottom:14px"><div class="panel"><h3>Investigación actual</h3>${current?`<strong>${esc(current.name_es)}</strong><p class="intro" style="text-align:left;margin:6px 0">Quedan ${n(st.remaining_points)} de ${n(st.effective_cost)} RP</p><div class="research-progress"><span style="width:${prog}%"></span></div>`:`<div class="empty">No estás investigando ningún hechizo.</div>`}</div><div class="panel"><h3>Investigar</h3><label class="field-caption">Hechizo<select id="research-spell" ${current?"disabled":""}>${current?`<option value="${esc(current.id)}">${esc(current.name_es)}</option>`:eligible.map(s=>`<option value="${esc(s.id)}">${esc(s.name_es)} · ${esc(rankNames[s.rank])} · ${n(s.research_cost)} RP</option>`).join("")}</select></label><label class="field-caption" style="display:grid;gap:6px;margin-top:10px">Turnos<input id="research-turns" type="number" min="1" max="50" value="1"></label><button id="research-button" class="primary-action" style="width:100%;margin-top:12px" ${ppt<1||(!current&&!eligible.length)?"disabled":""}>✦ INVESTIGAR</button></div></div>
  <div class="panel"><h3>Catálogo mágico</h3><div class="spell-grid">${cards}</div></div>`;
  $("#research-button")?.addEventListener("click",()=>doResearch($("#research-button")));
}
async function doResearch(btn){ const id=$("#research-spell")?.value; if(!id)return; const turns=Math.max(1,Math.min(50,Number($("#research-turns").value)||1)); await actionCall(btn,()=>rpc("research",{p_spell_ids:[id],p_turns:turns}),null,res=>res.completed?.length?`Has aprendido ${res.completed.map(x=>x.name_es).join(", ")}.`:`Investigación avanzada ${n(res.total_points_generated)} RP.`); }

async function renderArmy(){
  const army=await rpc("my_army"); const r=realmState.realm; const compatible=catalogs.units.filter(u=>u.acquisition==="recruit"&&(u.school_code==="plain"||u.school_code===r.school_code)); const unitById=Object.fromEntries(catalogs.units.map(u=>[u.id,u]));
  const armyRows=army.length?army.map(a=>{const u=unitById[a.unit_id]||{}; return `<div class="army-row"><div><strong>${esc(a.name_es)}</strong><small>${u.natural_flying?"Volador":u.natural_ranged?"A distancia":"Terrestre"} · PR ${n(u.power_rank)}</small></div><div><small>UNIDADES</small><strong>${n(a.quantity)}</strong></div><div><small>STACK NP</small><strong>${n(a.stack_np)}</strong></div>${u.undisbandable?`<span class="tag">INDISOLUBLE</span>`:`<button class="small-action disband-btn" data-unit="${esc(a.unit_id)}" data-max="${esc(a.quantity)}">DISOLVER</button>`}</div>`;}).join(""):`<div class="empty">Aún no tienes tropas.</div>`;
  const known=new Set(realmState.known_spells.map(s=>s.spell_id)); const summons=catalogs.summons.filter(s=>known.has(s.spell_id)).map(p=>{const sp=catalogs.spells.find(x=>x.id===p.spell_id),u=unitById[p.unit_id]; return `<div class="stat-card"><small>INVOCACIÓN</small><strong>${esc(u?.name_es||p.unit_id)}</strong><em>${esc(sp?.name_es||p.spell_id)} · ${n(sp?.base_mana_cost)} maná base · ${n(sp?.cast_turns)} turnos</em><button class="small-action summon-btn" data-spell="${esc(p.spell_id)}" style="margin-top:10px">INVOCAR</button></div>`;}).join("");
  $("#view-host").innerHTML=`${viewHeader("LEGIONES","Ejército","Recluta, invoca y ordena las fuerzas de tu reino.")}<div class="panel" style="margin-bottom:14px"><h3>Formaciones</h3><div class="army-list">${armyRows}</div></div>
  <div class="grid-2"><div class="panel"><h3>Reclutamiento</h3>${compatible.length?`<label class="field-caption">Unidad<select id="recruit-unit">${compatible.map(u=>`<option value="${esc(u.id)}">${esc(u.name_es)} · ${n(u.recruit_gold)} oro/u</option>`).join("")}</select></label><label class="field-caption" style="display:grid;gap:6px;margin-top:10px">Turnos<input id="recruit-turns" type="number" min="1" max="50" value="1"></label><button id="recruit-button" class="primary-action" style="width:100%;margin-top:12px">⚔ RECLUTAR</button>`:`<div class="empty">No hay unidades reclutables compatibles.</div>`}</div><div class="panel"><h3>Invocaciones conocidas</h3>${summons?`<div class="grid-2">${summons}</div>`:`<div class="empty">Aprende hechizos de invocación para traer criaturas a tu ejército.</div>`}</div></div>`;
  $("#recruit-button")?.addEventListener("click",()=>doRecruit($("#recruit-button")));
  $$(".summon-btn").forEach(b=>b.addEventListener("click",()=>doSummon(b.dataset.spell,b)));
  $$(".disband-btn").forEach(b=>b.addEventListener("click",()=>doDisband(b.dataset.unit,Number(b.dataset.max),b)));
}
async function doRecruit(btn){const unit=$("#recruit-unit").value,turns=Math.max(1,Math.min(50,Number($("#recruit-turns").value)||1)); await actionCall(btn,()=>rpc("recruit_units",{p_unit_id:unit,p_turns:turns}),null,res=>`Reclutadas ${n(res.recruited)} unidades.`);}
async function doSummon(spell,btn){await actionCall(btn,()=>rpc("cast_summon",{p_spell_id:spell}),null,res=>res.success?`Invocación exitosa: ${n(res.summoned)} criaturas.`:"La invocación ha fallado. El coste se ha consumido.");}
async function doDisband(unit,max,btn){const raw=prompt(`¿Cuántas unidades quieres disolver? Máximo ${n(max)}`,String(max)); if(raw===null)return; const qty=Math.floor(Number(raw)); if(!qty||qty<1||qty>max){toast("Cantidad no válida.","error");return;} await actionCall(btn,()=>rpc("disband_units",{p_unit_id:unit,p_quantity:qty}),`Has disuelto ${n(qty)} unidades.`);}

async function renderWar(){
  const targets=await rpc("attack_targets",{p_limit:100});
  const rows=targets.length?targets.map(t=>`<div class="target-row"><div><strong><span class="school-dot ${esc(t.school_code)}"></span>${esc(t.mage_name)}</strong><small>${esc(catalogs.schools.find(s=>s.code===t.school_code)?.name_es||t.school_code)}</small></div><div><small>TIERRAS</small><strong>${n(t.land)}</strong></div><div><small>PODER NETO</small><strong>${n(t.net_power)}</strong></div><div class="action-buttons">${t.can_attack?`<button class="small-action attack-btn" data-target="${esc(t.mage_name)}" data-mode="REGULAR">ATACAR</button><button class="small-action attack-btn" data-target="${esc(t.mage_name)}" data-mode="SIEGE">ASEDIO</button>`:`<span class="tag">NO ATACABLE</span>`}</div></div>`).join(""):`<div class="empty">Aún no hay otros Archimagos en esta temporada.</div>`;
  $("#view-host").innerHTML=`${viewHeader("FRONTERA","Guerra","Elige un Archimago rival. Cada ataque consume 2 turnos en el ruleset actual.")}<div class="panel"><div class="target-list">${rows}</div></div>`;
  $$(".attack-btn").forEach(b=>b.addEventListener("click",()=>confirmAttack(b.dataset.target,b.dataset.mode,b)));
}
async function confirmAttack(target,mode,btn){
  if(!confirm(`${mode==="SIEGE"?"Asediar":"Atacar"} a ${target}? Las bajas y el gasto de guerra serán permanentes.`))return;
  await actionCall(btn,()=>rpc("attack_mage",{p_target_mage_name:target,p_mode:mode}),null,res=>res.attacker_victory?`Victoria. Has conquistado ${n(res.land_gained)} acres.`:`El ataque no ha logrado la victoria. Pérdidas: ${(Number(res.attacker_loss_bp)/100).toFixed(2)}%.`);
  await renderWar();
}

async function renderRanking(){
  const rows=await rpc("leaderboard",{p_limit:100}); const mine=realmState.realm.mage_name.toLowerCase();
  $("#view-host").innerHTML=`${viewHeader("MUNDO","Clasificación","Los Archimagos de la temporada ordenados por Poder Neto.")}<div class="table-wrap"><table><thead><tr><th>#</th><th>Archimago</th><th>Escuela</th><th>Tierras</th><th>Poder Neto</th><th>Estado</th></tr></thead><tbody>${rows.map(x=>`<tr class="${String(x.mage_name).toLowerCase()===mine?"rank-me":""}"><td>${n(x.rank)}</td><td><strong>${esc(x.mage_name)}</strong></td><td><span class="school-dot ${esc(x.school_code)}"></span>${esc(catalogs.schools.find(s=>s.code===x.school_code)?.name_es||x.school_code)}</td><td>${n(x.land)}</td><td>${n(x.net_power)}</td><td>${esc(x.status)}</td></tr>`).join("")}</tbody></table></div>`;
}

async function renderBattles(){
  const reports=await rpc("my_battle_reports",{p_limit:50});
  const rows=reports.length?reports.map(r=>`<div class="battle-row"><div><span class="tag ${r.result==="VICTORY"?"win":"loss"}">${r.result==="VICTORY"?"VICTORIA":"DERROTA"}</span></div><div><strong>${esc(r.opponent_mage_name)}</strong><small>${new Date(r.created_at).toLocaleString("es-ES")} · ${r.mode==="SIEGE"?"Asedio":"Ataque"}</small></div><div><small>TU PÉRDIDA</small><strong>${(Number(r.my_loss_bp)/100).toFixed(2)}%</strong></div><div><small>TIERRA</small><strong>${Number(r.land_change)>=0?"+":""}${n(r.land_change)}</strong></div><button class="small-action report-btn" data-battle="${esc(r.battle_id)}">INFORME</button></div>`).join(""):`<div class="empty">Todavía no has participado en ninguna batalla.</div>`;
  $("#view-host").innerHTML=`${viewHeader("CRÓNICAS","Informes de batalla","Cada choque queda registrado golpe a golpe.")}<div class="panel"><div class="battle-list">${rows}</div></div>`;
  $$(".report-btn").forEach(b=>b.addEventListener("click",()=>openBattleReport(b.dataset.battle)));
}
async function openBattleReport(id){
  try{
    const d=await rpc("battle_report_detail",{p_battle_id:id}); const b=d.battle;
    const unitRows=(d.units||[]).map(u=>`<tr><td>${esc(u.side==="attacker"?"Atacante":"Defensor")}</td><td>${esc(u.name_es)}</td><td>${n(u.initial_quantity)}</td><td>${n(u.final_quantity)}</td><td>${n(u.recovered)}</td></tr>`).join("");
    const events=(d.events||[]).map(e=>`<div class="battle-event"><span>#${n(e.sequence)}</span><div><b>${esc(e.actor_unit_id||e.type)}</b> ${e.target_unit_id?`→ ${esc(e.target_unit_id)}`:""}</div><span>${e.kills?`${n(e.kills)} bajas`:esc(e.type)}</span></div>`).join("");
    $("#modal-content").innerHTML=`<span class="section-kicker">INFORME COMPLETO</span><h3>${b.mode==="SIEGE"?"Asedio":"Ataque regular"} · ${b.attacker_victory?"Victoria atacante":"Defensa exitosa"}</h3><div class="grid-3"><div class="stat-card"><small>Pérdidas atacante</small><strong>${(Number(b.attacker_loss_bp)/100).toFixed(2)}%</strong></div><div class="stat-card"><small>Pérdidas defensor</small><strong>${(Number(b.defender_loss_bp)/100).toFixed(2)}%</strong></div><div class="stat-card"><small>Tierra conquistada</small><strong>${n(b.land_gained)}</strong></div></div><h3>Formaciones</h3><div class="table-wrap"><table><thead><tr><th>Bando</th><th>Unidad</th><th>Inicio</th><th>Final</th><th>Recuperadas</th></tr></thead><tbody>${unitRows}</tbody></table></div><h3>Secuencia</h3><div>${events||'<div class="empty">Sin eventos.</div>'}</div>`;
    show($("#modal"));
  }catch(e){toast(humanError(e),"error");}
}

async function actionCall(btn,fn,successMessage=null,messageFn=null){
  const old=btn?.innerHTML; if(btn){btn.disabled=true;btn.textContent="PROCESANDO...";}
  try{const res=await fn(); toast(messageFn?messageFn(res):(successMessage||"Acción completada."),"success"); realmState=await rpc("my_realm_state"); renderChrome(); await renderView(currentView); return res;}
  catch(e){toast(humanError(e),"error"); throw e;}
  finally{if(btn){btn.disabled=false;if(old)btn.innerHTML=old;}}
}

function wireStaticEvents(){
  $("#login-tab").addEventListener("click",()=>switchAuthMode("login")); $("#register-tab").addEventListener("click",()=>switchAuthMode("register"));
  $("#auth-form").addEventListener("submit",async e=>{
    e.preventDefault();
    clearNotice($("#auth-notice"));
    const username=$("#username").value.trim(),password=$("#password").value,btn=$("#submit-button");
    const registering=mode==="register";
    if(username.length<3||username.length>24){setNotice($("#auth-notice"),"El nombre de usuario debe tener entre 3 y 24 caracteres.");return;}
    if(password.length<4){setNotice($("#auth-notice"),"La contraseña debe tener al menos 4 caracteres.");return;}
    btn.disabled=true; $("#submit-label").textContent=registering?"CREANDO CUENTA...":"ENTRANDO...";
    try{
      if(registering){
        if(password!==$("#confirm-password").value)throw new Error("Las contraseñas no coinciden.");
        await registerAccount(username,password);
      }
      await signInAccount(username,password);
      await bootGame();
    }catch(err){setNotice($("#auth-notice"),humanError(err));}
    finally{btn.disabled=false;$("#submit-label").textContent=registering?"CREAR CUENTA":"ENTRAR";}
  });
  $("#create-form").addEventListener("submit",async e=>{
    e.preventDefault(); clearNotice($("#create-notice")); const username=String(getSession()?.user?.user_metadata?.username||"").trim(); if(!username){setNotice($("#create-notice"),"No se ha podido recuperar tu nombre de usuario. Vuelve a iniciar sesión.");return;} if(!selectedSchool){setNotice($("#create-notice"),"Elige una de las Cinco Escuelas.");return;} const btn=$("#create-button"); btn.disabled=true;
    try{await rpc("create_archmage",{p_display_name:username,p_mage_name:username,p_school_code:selectedSchool}); toast("Tu reino ha sido fundado."); realmState=await rpc("my_realm_state"); showGame();}
    catch(err){setNotice($("#create-notice"),humanError(err));} finally{btn.disabled=false;}
  });
  $("#creation-logout").addEventListener("click",signOut); $("#logout-button").addEventListener("click",signOut); $("#refresh-button").addEventListener("click",()=>refreshState(false));
  $("#main-nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)navigate(b.dataset.view);}); $("#mobile-nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)navigate(b.dataset.view);});
  $("#modal-close").addEventListener("click",()=>hide($("#modal"))); $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")hide($("#modal"));});
}

async function init(){
  wireStaticEvents(); const session=await validSession(); if(session)await bootGame(); else showAuth();
}
window.addEventListener("DOMContentLoaded",init);

</script>
